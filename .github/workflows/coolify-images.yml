# Build Retroscope images on GitHub runners and push to GHCR.
# Coolify on the small Hetzner VPS should pull these (see docker-compose.selfhost.prebuilt.yml)
# instead of running Atlaskit `vite build` locally (DUN-83).
#
# Deploy ordering (GitHub App users): keep the GitHub App installed, but disable
# Coolify "Auto Deploy" so merge-to-main does not race GHCR. Set secret
# COOLIFY_WEBHOOK to the resource's Deploy Webhook URL (CI → Coolify). That is
# not a manual Git webhook — the App still owns git access.
name: Coolify images

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.selfhost.prebuilt.yml'
      - 'docker-compose.selfhost.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'nginx.conf'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'postcss.config.js'
      - 'tailwind.config.ts'
      - 'components.json'
      - 'public/**'
      - 'src/**'
      - 'scripts/**'
      - 'tools/poker-local-advisor/**'
      - 'server/**'
      - '.github/workflows/coolify-images.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/${{ github.repository }}-web
  API_IMAGE: ghcr.io/${{ github.repository }}-api

jobs:
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Require Vite build-time vars
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=0
          for name in VITE_API_BASE_URL VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set (repo Variables / Secrets). See COOLIFY_SELFHOST.md."
              missing=1
            fi
          done
          exit "$missing"

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          build-args: |
            BUILD_MAX_OLD_SPACE_SIZE=4096
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy-coolify:
    needs: [build-api, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify redeploy after GHCR push
        env:
          # Prefer secret (Coolify docs). Var name kept as fallback.
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          WEBHOOK_FALLBACK: ${{ vars.COOLIFY_DEPLOY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          URL="${WEBHOOK:-}"
          if [ -z "$URL" ]; then
            URL="${WEBHOOK_FALLBACK:-}"
          fi
          if [ -z "$URL" ]; then
            echo "::warning::deploy-coolify skipped: set GitHub Actions secret COOLIFY_WEBHOOK to your Coolify Deploy Webhook URL."
            echo "Also disable Coolify git Auto Deploy for this resource so deploys wait for GHCR images."
            exit 0
          fi
          echo "Triggering Coolify webhook after images were pushed..."
          if [ -n "${TOKEN:-}" ]; then
            curl --fail-with-body --request GET "$URL" --header "Authorization: Bearer $TOKEN"
          else
            curl --fail-with-body --request GET "$URL"
          fi
          echo
          echo "Coolify deploy triggered."
