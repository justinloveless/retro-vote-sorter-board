# Coolify production stack for Retroscope self-host (DUN-76 / Phase 1).
# Rules: use `expose` only (no host `ports`), set CPU/memory limits,
# keep PostgREST internal (no Coolify public domain).
#
# Build CPU (DUN-83): Prefer docker-compose.selfhost.prebuilt.yml on small VPS
# hosts so Coolify never runs vite/npm ci. This file builds from Dockerfiles
# (local/dev or build server only). If you must build here: set
# COMPOSE_PARALLEL_LIMIT=1 and Concurrent builds = 1.

configs:
  # Inline content (not file:). Coolify runs compose via a helper container;
  # file:/bind paths under /artifacts are invisible to the host Docker daemon.
  # Keep in sync with server/postgres/init/01-roles.sql
  retroscope_roles_sql:
    content: |
      -- Minimal roles so PostgREST can start in Phase 1.
      -- Full schema + RLS bootstrap lands in Phase 3.
      
      DO $$
      BEGIN
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN
          CREATE ROLE anon NOLOGIN;
        END IF;
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN
          CREATE ROLE authenticated NOLOGIN;
        END IF;
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'service_role') THEN
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
        END IF;
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticator') THEN
          CREATE ROLE authenticator NOINHERIT LOGIN PASSWORD 'retroscope_authenticator_pass';
        END IF;
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'retroscope_app') THEN
          CREATE ROLE retroscope_app LOGIN PASSWORD 'retroscope_app_pass';
        END IF;
      END
      $$;
      
      GRANT anon TO authenticator;
      GRANT authenticated TO authenticator;
      GRANT service_role TO authenticator;
      GRANT authenticated TO retroscope_app;
      GRANT anon TO retroscope_app;
      
      GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role, retroscope_app, authenticator;
      GRANT ALL ON SCHEMA public TO retroscope_app;
      
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO anon;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO authenticated;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO service_role;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO retroscope_app;

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retroscope}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - retroscope_pg_data:/var/lib/postgresql/data
    configs:
      - source: retroscope_roles_sql
        target: /docker-entrypoint-initdb.d/01-roles.sql
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 768M

  # docker-entrypoint-initdb.d only runs on an empty volume. Re-apply idempotent
  # roles on every deploy so PostgREST's authenticator exists after volume reuse.
  db-init:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:-retroscope}
    configs:
      - source: retroscope_roles_sql
        target: /init/01-roles.sql
    command: ['psql', '-v', 'ON_ERROR_STOP=1', '-f', '/init/01-roles.sql']
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M

  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    environment:
      PGRST_DB_URI: ${PGRST_DB_URI:-postgresql://authenticator:retroscope_authenticator_pass@postgres:5432/retroscope}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public}
      PGRST_DB_ANON_ROLE: ${PGRST_DB_ANON_ROLE:-anon}
      PGRST_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}
      PGRST_DB_EXTRA_SEARCH_PATH: public
      # Internal only — do not attach a Coolify domain to this service.
      PGRST_OPENAPI_SERVER_PROXY_URI: ${PGRST_OPENAPI_SERVER_PROXY_URI:-http://postgrest:3000}
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    expose:
      - '3000'
    # No healthcheck: postgrest image is scratch-based (no wget/curl/shell).
    # Readiness is covered by api /readyz.
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        BUILD_CPU_LIST: ${BUILD_CPU_LIST:-0}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://retroscope_app:retroscope_app_pass@postgres:5432/retroscope}
      POSTGREST_URL: ${POSTGREST_URL:-http://postgrest:3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}
      ALLOW_ORIGINS: ${ALLOW_ORIGINS:-https://retro.example.com}
      UPLOADS_DIR: /data/uploads
      SELF_HOSTED_API_BASE_URL: ${SELF_HOSTED_API_BASE_URL:-https://retro-api.example.com}
    volumes:
      - retroscope_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      postgrest:
        condition: service_started
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Keep ≤3072 on shared Coolify VPS (see COOLIFY_SELFHOST.md / DUN-83).
        BUILD_MAX_OLD_SPACE_SIZE: ${BUILD_MAX_OLD_SPACE_SIZE:-3072}
        # Pin vite build to one host CPU (taskset). Override only if you know you have spare cores.
        BUILD_CPU_LIST: ${BUILD_CPU_LIST:-0}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://retro-api.example.com}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - '80'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M

volumes:
  retroscope_pg_data:
    name: retroscope_pg_data
  retroscope_uploads:
    name: retroscope_uploads
