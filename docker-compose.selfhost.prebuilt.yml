# Coolify production stack using GHCR prebuilt images (DUN-83).
# Prefer this on small Hetzner/Coolify hosts — the VPS only pulls images; it never
# runs Atlaskit `vite build` / `npm ci` (which pegs CPU + disk).
#
# Images are published by .github/workflows/coolify-images.yml
#   ghcr.io/<owner>/retro-vote-sorter-board-web:latest
#   ghcr.io/<owner>/retro-vote-sorter-board-api:latest
#
# Coolify: set compose path to this file, authenticate GHCR on the server if
# packages are private, disable git auto-deploy, and let GitHub Actions call the
# deploy webhook AFTER images are pushed (see COOLIFY_SELFHOST.md).

configs:
  # Inline content (not file:). Coolify helper /artifacts binds are invisible to
  # the host Docker daemon. Keep in sync with server/postgres/init/01-roles.sql
  # (SQL must stay free of `$` — Compose interpolates them).
  retroscope_roles_sql:
    content: |
      -- Minimal roles so PostgREST can start in Phase 1–2.
      -- Phase 3 adds auth.uid()/grants in 03-rls-helpers.sql.
      --
      -- Use psql \gexec instead of PL/pgSQL DO blocks. Docker Compose interpolates
      -- dollar signs in compose YAML, which corrupted dollar-quoted DO bodies under
      -- Coolify. \gexec runs each SELECT result as SQL (psql only — used by db-init).
      --
      -- Coolify compose embeds this via configs.content — keep compose in sync.
      
      SELECT format('CREATE ROLE %I NOLOGIN', rolname)
      FROM (VALUES ('anon'), ('authenticated')) AS t(rolname)
      WHERE NOT EXISTS (SELECT FROM pg_roles r WHERE r.rolname = t.rolname)
      \gexec
      
      SELECT format('CREATE ROLE %I NOLOGIN BYPASSRLS', 'service_role')
      WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'service_role')
      \gexec
      
      SELECT format(
        'CREATE ROLE %I NOINHERIT LOGIN PASSWORD %L',
        'authenticator',
        'retroscope_authenticator_pass'
      )
      WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticator')
      \gexec
      
      SELECT format(
        'CREATE ROLE %I LOGIN PASSWORD %L',
        'retroscope_app',
        'retroscope_app_pass'
      )
      WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'retroscope_app')
      \gexec
      
      GRANT anon TO authenticator;
      GRANT authenticated TO authenticator;
      GRANT service_role TO authenticator;
      GRANT authenticated TO retroscope_app;
      GRANT anon TO retroscope_app;
      
      GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role, retroscope_app, authenticator;
      GRANT ALL ON SCHEMA public TO retroscope_app;
      
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO anon;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO authenticated;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO service_role;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO retroscope_app;
  # Keep in sync with server/postgres/init/02-auth-schema.sql
  # (SQL must stay free of `$` — Compose interpolates them).
  retroscope_auth_sql:
    content: |
      -- Local auth schema for Phase 2 (DUN-77).
      -- Shape aligns with Supabase auth.users / auth.identities for UUID-preserving import.
      --
      -- Coolify compose embeds this via configs.content — keep compose in sync.
      -- SQL must stay free of `$` (Compose interpolates dollar signs).

      CREATE SCHEMA IF NOT EXISTS auth;

      GRANT USAGE ON SCHEMA auth TO retroscope_app;
      GRANT ALL ON SCHEMA auth TO retroscope_app;

      CREATE TABLE IF NOT EXISTS auth.users (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        instance_id UUID,
        aud TEXT DEFAULT 'authenticated',
        role TEXT DEFAULT 'authenticated',
        email TEXT,
        encrypted_password TEXT,
        email_confirmed_at TIMESTAMPTZ,
        invited_at TIMESTAMPTZ,
        confirmation_token TEXT,
        confirmation_sent_at TIMESTAMPTZ,
        recovery_token TEXT,
        recovery_sent_at TIMESTAMPTZ,
        email_change_token_new TEXT,
        email_change TEXT,
        email_change_sent_at TIMESTAMPTZ,
        last_sign_in_at TIMESTAMPTZ,
        raw_app_meta_data JSONB NOT NULL DEFAULT '{}'::jsonb,
        raw_user_meta_data JSONB NOT NULL DEFAULT '{}'::jsonb,
        is_super_admin BOOLEAN,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        phone TEXT,
        phone_confirmed_at TIMESTAMPTZ,
        phone_change TEXT,
        phone_change_token TEXT,
        phone_change_sent_at TIMESTAMPTZ,
        email_change_token_current TEXT,
        email_change_confirm_status SMALLINT DEFAULT 0,
        banned_until TIMESTAMPTZ,
        reauthentication_token TEXT,
        reauthentication_sent_at TIMESTAMPTZ,
        is_sso_user BOOLEAN NOT NULL DEFAULT FALSE,
        deleted_at TIMESTAMPTZ,
        is_anonymous BOOLEAN NOT NULL DEFAULT FALSE
      );

      CREATE UNIQUE INDEX IF NOT EXISTS idx_auth_users_email_unique
        ON auth.users (lower(email))
        WHERE email IS NOT NULL AND deleted_at IS NULL;

      CREATE INDEX IF NOT EXISTS idx_auth_users_email ON auth.users (email);

      CREATE TABLE IF NOT EXISTS auth.identities (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES auth.users (id) ON DELETE CASCADE,
        identity_data JSONB NOT NULL DEFAULT '{}'::jsonb,
        provider TEXT NOT NULL,
        provider_id TEXT NOT NULL,
        last_sign_in_at TIMESTAMPTZ,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        email TEXT,
        UNIQUE (provider, provider_id)
      );

      CREATE INDEX IF NOT EXISTS idx_auth_identities_user_id ON auth.identities (user_id);
      CREATE INDEX IF NOT EXISTS idx_auth_identities_provider_id ON auth.identities (provider, provider_id);

      CREATE TABLE IF NOT EXISTS auth.refresh_tokens (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        token TEXT NOT NULL UNIQUE,
        user_id UUID NOT NULL REFERENCES auth.users (id) ON DELETE CASCADE,
        parent TEXT,
        revoked BOOLEAN NOT NULL DEFAULT FALSE,
        session_id UUID,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
      );

      CREATE INDEX IF NOT EXISTS idx_auth_refresh_tokens_token ON auth.refresh_tokens (token);
      CREATE INDEX IF NOT EXISTS idx_auth_refresh_tokens_user_id ON auth.refresh_tokens (user_id);

      CREATE TABLE IF NOT EXISTS auth.verification_codes (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES auth.users (id) ON DELETE CASCADE,
        code TEXT NOT NULL,
        type TEXT NOT NULL,
        redirect_to TEXT,
        expires_at TIMESTAMPTZ NOT NULL,
        used_at TIMESTAMPTZ,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
      );

      CREATE INDEX IF NOT EXISTS idx_auth_verification_codes_code ON auth.verification_codes (code);
      CREATE INDEX IF NOT EXISTS idx_auth_verification_codes_user_id ON auth.verification_codes (user_id);

      GRANT ALL ON ALL TABLES IN SCHEMA auth TO retroscope_app;
      GRANT ALL ON ALL SEQUENCES IN SCHEMA auth TO retroscope_app;
      ALTER DEFAULT PRIVILEGES IN SCHEMA auth GRANT ALL ON TABLES TO retroscope_app;
      ALTER DEFAULT PRIVILEGES IN SCHEMA auth GRANT ALL ON SEQUENCES TO retroscope_app;

  retroscope_rls_sql:
    content: |
      -- Phase 3 (DUN-78): RLS helpers + PostgREST grants.
      -- PostgREST sets request.jwt.claim.* / request.jwt.claims from the access JWT.
      --
      -- Coolify compose embeds this via configs.content — keep compose in sync.
      -- SQL must stay free of dollar signs (Compose interpolates them).

      CREATE SCHEMA IF NOT EXISTS auth;

      GRANT USAGE ON SCHEMA auth TO anon, authenticated, service_role, retroscope_app, authenticator;

      -- auth.uid() — current user id from JWT (PostgREST-compatible)
      CREATE OR REPLACE FUNCTION auth.uid()
      RETURNS uuid
      LANGUAGE sql
      STABLE
      AS '
        SELECT NULLIF(
          COALESCE(
            current_setting(''request.jwt.claim.sub'', true),
            (current_setting(''request.jwt.claims'', true)::jsonb ->> ''sub'')
          ),
          ''''
        )::uuid;
      ';

      -- auth.role() — JWT role claim (authenticated / anon / service_role)
      CREATE OR REPLACE FUNCTION auth.role()
      RETURNS text
      LANGUAGE sql
      STABLE
      AS '
        SELECT COALESCE(
          NULLIF(current_setting(''request.jwt.claim.role'', true), ''''),
          NULLIF(current_setting(''request.jwt.claims'', true)::jsonb ->> ''role'', ''''),
          ''anon''
        );
      ';

      -- auth.jwt() — full JWT claims as jsonb
      CREATE OR REPLACE FUNCTION auth.jwt()
      RETURNS jsonb
      LANGUAGE sql
      STABLE
      AS '
        SELECT COALESCE(
          NULLIF(current_setting(''request.jwt.claims'', true), '''')::jsonb,
          jsonb_build_object(
            ''sub'', NULLIF(current_setting(''request.jwt.claim.sub'', true), ''''),
            ''role'', COALESCE(
              NULLIF(current_setting(''request.jwt.claim.role'', true), ''''),
              ''anon''
            )
          )
        );
      ';

      GRANT EXECUTE ON FUNCTION auth.uid() TO anon, authenticated, service_role, retroscope_app, authenticator;
      GRANT EXECUTE ON FUNCTION auth.role() TO anon, authenticated, service_role, retroscope_app, authenticator;
      GRANT EXECUTE ON FUNCTION auth.jwt() TO anon, authenticated, service_role, retroscope_app, authenticator;

      -- Table / sequence / function grants for PostgREST roles (idempotent after restore)
      GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role, retroscope_app, authenticator;
      GRANT ALL ON SCHEMA public TO retroscope_app;

      GRANT SELECT ON ALL TABLES IN SCHEMA public TO anon;
      GRANT ALL ON ALL TABLES IN SCHEMA public TO authenticated;
      GRANT ALL ON ALL TABLES IN SCHEMA public TO service_role;
      GRANT ALL ON ALL TABLES IN SCHEMA public TO retroscope_app;

      GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO anon;
      GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO authenticated;
      GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO service_role;
      GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO retroscope_app;

      GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO anon;
      GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO authenticated;
      GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO service_role;
      GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO retroscope_app;

      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO anon;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO authenticated;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO service_role;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO retroscope_app;

      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO anon;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO authenticated;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO service_role;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO retroscope_app;

      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO anon;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO authenticated;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO service_role;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO retroscope_app;

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retroscope}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - retroscope_pg_data:/var/lib/postgresql/data
    configs:
      - source: retroscope_roles_sql
        target: /docker-entrypoint-initdb.d/01-roles.sql
      - source: retroscope_auth_sql
        target: /docker-entrypoint-initdb.d/02-auth-schema.sql
      - source: retroscope_rls_sql
        target: /docker-entrypoint-initdb.d/03-rls-helpers.sql
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 768M

  # docker-entrypoint-initdb.d only runs on an empty volume. Re-apply idempotent
  # roles on every deploy so PostgREST's authenticator exists after volume reuse.
  db-init:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:-retroscope}
    configs:
      - source: retroscope_roles_sql
        target: /init/01-roles.sql
      - source: retroscope_auth_sql
        target: /init/02-auth-schema.sql
      - source: retroscope_rls_sql
        target: /init/03-rls-helpers.sql
    command:
      [
        'psql',
        '-v',
        'ON_ERROR_STOP=1',
        '-f',
        '/init/01-roles.sql',
        '-f',
        '/init/02-auth-schema.sql',
        '-f',
        '/init/03-rls-helpers.sql',
      ]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M

  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    environment:
      PGRST_DB_URI: ${PGRST_DB_URI:-postgresql://authenticator:retroscope_authenticator_pass@postgres:5432/retroscope}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public}
      PGRST_DB_ANON_ROLE: ${PGRST_DB_ANON_ROLE:-anon}
      PGRST_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}
      PGRST_DB_EXTRA_SEARCH_PATH: public
      # Internal only — do not attach a Coolify domain to this service.
      PGRST_OPENAPI_SERVER_PROXY_URI: ${PGRST_OPENAPI_SERVER_PROXY_URI:-http://postgrest:3000}
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    expose:
      - '3000'
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  api:
    image: ${API_IMAGE:-ghcr.io/justinloveless/retro-vote-sorter-board-api:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://retroscope_app:retroscope_app_pass@postgres:5432/retroscope}
      POSTGREST_URL: ${POSTGREST_URL:-http://postgrest:3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}
      ALLOW_ORIGINS: ${ALLOW_ORIGINS:-https://retro.example.com}
      UPLOADS_DIR: /data/uploads
      SELF_HOSTED_API_BASE_URL: ${SELF_HOSTED_API_BASE_URL:-https://retro-api.example.com}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://retro.example.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH_GOOGLE_REDIRECT_URI: ${OAUTH_GOOGLE_REDIRECT_URI:-https://retro-api.example.com/auth/v1/callback}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes:
      - retroscope_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      postgrest:
        condition: service_started
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  web:
    image: ${WEB_IMAGE:-ghcr.io/justinloveless/retro-vote-sorter-board-web:latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - '80'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M

volumes:
  retroscope_pg_data:
    name: retroscope_pg_data
  retroscope_uploads:
    name: retroscope_uploads
